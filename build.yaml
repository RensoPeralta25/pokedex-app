targets:
  $default:
    builders:
      drift_dev:
        options:
          # Por defecto Drift guarda segundos Unix y pierde los milisegundos.
          store_date_time_values_as_text: true
          databases:
            app_database: lib/core/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
